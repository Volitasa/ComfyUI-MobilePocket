name: Build Android APK

# 触发条件：推送到主分支时自动打包，或者在 GitHub 网页上手动点击运行
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境 (用于编译 Vue)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 配置 Java JDK 环境 (用于编译 Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. 安装前端依赖并构建静态文件
      - name: Build Web Assets
        run: |
          npm ci
          npm run build

      # 5. 同步前端资源到 Android 工程
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. 赋予 Gradle 脚本执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 7. 使用 Gradle 编译生成 Release 版（未签名）APK
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. 原生标准做法：使用 Android 官方工具 zipalign 和 apksigner 进行签名
      - name: Native Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 1. 将 Base64 还原为真实的 .jks 文件
          echo $KEYSTORE_BASE64 | base64 -d > release.jks

          # 2. 找到服务器上最新版本的 Android Build Tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)

          # 3. 对齐优化 APK (Zipalign)
          $BUILD_TOOLS_DIR/zipalign -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk

          # 4. 正式签名 (Apksigner)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-key-alias $ALIAS --ks-pass pass:$KEYSTORE_PASS --key-pass pass:$KEY_PASS --out ComfyUI-Mobile-Web.apk aligned.apk

      # 9. 上传签名后的文件
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Mobile-Web-Release-APK
          path: ComfyUI-Mobile-Web.apk
