name: Build Android APK

# 触发条件：推送到主分支时自动打包，或者在 GitHub 网页上手动点击运行
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境 (用于编译 Vue)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 配置 Java JDK 环境 (用于编译 Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. 安装前端依赖并构建静态文件
      - name: Build Web Assets
        run: |
          npm ci
          npm run build

      # 5. 同步前端资源到 Android 工程
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. 赋予 Gradle 脚本执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 7. 使用 Gradle 编译生成 Debug 版 APK
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 8. 收集生成的 APK 并上传到 GitHub 面板供下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
