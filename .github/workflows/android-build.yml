name: Build Android APK

# 触发条件：推送到主分支时自动打包，或者在 GitHub 网页上手动点击运行
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境 (用于编译 Vue)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 配置 Java JDK 环境 (用于编译 Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. 安装前端依赖并构建静态文件
      - name: Build Web Assets
        run: |
          npm ci
          npm run build

      # 5. 同步前端资源到 Android 工程
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. 赋予 Gradle 脚本执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 7. 使用 Gradle 编译生成 Release 版（未签名）APK
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. 使用 GitHub Secrets 注入密钥并进行 V1/V2 正式签名
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # 9. 重命名生成的 APK 文件，去掉默认的 app-release 丑陋命名
      - name: Rename APK File
        run: |
          mv ${{steps.sign_app.outputs.signedReleaseFile}} android/app/build/outputs/apk/release/ComfyUI-Mobile-Web.apk

      # 10. 收集签名且重命名后的 APK 并上传
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Mobile-Web-Release-APK # GitHub 网页上显示的压缩包名称
          path: android/app/build/outputs/apk/release/ComfyUI-Mobile-Web.apk
