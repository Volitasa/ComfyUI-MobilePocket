name: Build and Release APK

# 触发条件：当你推送一个 v 开头的 tag (比如 v1.0.0) 时，自动运行
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest # 使用 GitHub 免费提供的云端 Linux 机器

    steps:
      # 1. 拉取你的最新代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 环境 (安卓打包必须)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 安装 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 4. 下载项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 5. 执行云端打包命令
      - name: Build APK
        run: flutter build apk --release

      # 6. 自动发布到 GitHub Releases 并上传 APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}