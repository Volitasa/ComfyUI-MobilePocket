name: Build and Release APK

# 触发条件：
# 1. 推送 v 开头的 tag（如 v1.0.4）时自动打包并发布
# 2. 也可在 Actions 页面手动触发（workflow_dispatch），用于验证签名链路是否正常
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest # 使用 GitHub 免费提供的云端 Linux 机器

    steps:
      # 1. 拉取你的最新代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 环境 (安卓打包必须)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 安装 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 4. 下载项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 5. 还原正式签名（keystore 与密码全部来自仓库 Secrets，不入库）
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          # 兼容各种导出方式：UTF-16(PowerShell 重定向)、带 BOM、带换行/空格
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -cd 'A-Za-z0-9+/=' \
            | base64 --decode > comfy-release-key.jks

          if [ ! -s comfy-release-key.jks ]; then
            echo "::error::KEYSTORE_BASE64 解码结果为空，请检查该 Secret 是否为完整的 base64 文本"
            exit 1
          fi

          echo "keystore size=$(stat -c%s comfy-release-key.jks) bytes"
          echo "keystore magic=$(head -c 4 comfy-release-key.jks | od -An -tx1 | tr -d ' \n')"

          cat > android/key.properties <<PROPS
          storeFile=../../comfy-release-key.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          PROPS

      # 6. 执行云端打包命令
      - name: Build APK
        run: flutter build apk --release

      # 7. 校验产物确实是正式签名（打印证书指纹，便于跨版本比对签名是否一致）
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee apk-signature.txt
          else
            echo "未找到 apksigner，跳过签名校验" | tee apk-signature.txt
          fi

      # 8. 自动发布到 GitHub Releases 并上传 APK（仅 tag 推送时）
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
